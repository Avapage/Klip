plugins { id 'com.android.application' }
android {
    namespace 'com.avapage.video'
    compileSdk 35
    defaultConfig {
        applicationId 'com.avapage.video'
        minSdk 29
        targetSdk 35
        versionCode 13
        versionName '0.2.7 R1'
    }
    signingConfigs {
        debug {
            v1SigningEnabled true
            enableV2Signing true
            enableV3Signing true
        }
        release {
            if (System.getenv('KLIP_KEYSTORE_PATH')) {
                storeFile file(System.getenv('KLIP_KEYSTORE_PATH'))
                storePassword System.getenv('KLIP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KLIP_KEY_ALIAS')
                keyPassword System.getenv('KLIP_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('KLIP_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    flavorDimensions 'device'
    productFlavors {
        arm64 {
            dimension 'device'
            ndk { abiFilters 'arm64-v8a' }
        }
        universal {
            dimension 'device'
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies {
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
