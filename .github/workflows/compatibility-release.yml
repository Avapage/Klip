name: APK compatibility and 0.2.7 release
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK metadata and signing
        shell: bash
        run: |
          set -euo pipefail
          toolsdir="$ANDROID_HOME/build-tools/35.0.0"
          for variant in arm64 universal; do
            apk="app/build/outputs/apk/$variant/debug/app-$variant-debug.apk"
            "$toolsdir/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/$variant.txt"
            grep -q "sdkVersion:'29'" "$RUNNER_TEMP/$variant.txt"
            grep -q "versionName='0.2.7'" "$RUNNER_TEMP/$variant.txt"
            grep -q 'arm64-v8a' "$RUNNER_TEMP/$variant.txt"
            "$toolsdir/apksigner" verify --verbose --min-sdk-version 23 --max-sdk-version 23 "$apk" | grep 'Verified using v1 scheme.*true'
            "$toolsdir/apksigner" verify --verbose --min-sdk-version 24 --max-sdk-version 27 "$apk" | grep 'Verified using v2 scheme.*true'
            "$toolsdir/apksigner" verify --verbose --min-sdk-version 29 "$apk" | grep 'Verified using v3 scheme.*true'
          done
          grep -q 'x86_64' "$RUNNER_TEMP/universal.txt"
          grep -q 'armeabi-v7a' "$RUNNER_TEMP/universal.txt"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/verify-apk-install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: verified-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-apks
          path: apks
      - name: Publish verified APKs as a new release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/klip-v0.2.7" >/dev/null 2>&1 || gh release view klip-v0.2.7 >/dev/null 2>&1; then
            echo 'Release or tag already exists; refusing to overwrite.' >&2
            exit 1
          fi
          arm="$(find apks -name app-arm64-debug.apk -print -quit)"
          universal="$(find apks -name app-universal-debug.apk -print -quit)"
          test -n "$arm" && test -n "$universal"
          cp "$arm" Klip-0.2.7-ARM64.apk
          cp "$universal" Klip-0.2.7-Universal.apk
          cat > notes.txt <<'EOF'
          Klip 0.2.7 provides standalone ARM64 and Universal APKs for Android 10 and newer. Both APKs use additional signing schemes and were checked for installation and launch on an Android 16 emulator. The cause of the reported phone-specific installation error has not been confirmed.
          
          Choose ARM64 for most modern phones, or Universal if unsure. These are debug preview builds. If Android reports an update-signature conflict, uninstall the old app first; files saved in Downloads remain, but app settings and browser sessions are removed.
          EOF
          gh release create klip-v0.2.7 Klip-0.2.7-ARM64.apk Klip-0.2.7-Universal.apk --target "$GITHUB_SHA" --title "Klip 0.2.7 for Android" --notes-file notes.txt --latest
