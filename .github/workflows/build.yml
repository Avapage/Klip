name: Build Klip APK
on:
  push:
    branches: [main]
    paths: ['**', '.github/workflows/build.yml']
  pull_request:
    paths: ['**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Klip-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish direct APK downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$current" != "$GITHUB_SHA" ]; then echo "Skipping outdated build"; exit 0; fi
          mkdir -p /tmp/klip-apks
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk /tmp/klip-apks/Klip-0.2.5-R4-ARM64.apk
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk /tmp/klip-apks/Klip-0.2.5-R4-ARMv7.apk
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk /tmp/klip-apks/Klip-0.2.5-R4-x86_64.apk
          cp app/build/outputs/apk/debug/app-universal-debug.apk /tmp/klip-apks/Klip-0.2.5-R4-Universal.apk
          # When preparing a future build, list only the two newest revisions in the notes.
          cat > /tmp/klip-notes.md <<'NOTES'
          ## Klip for Android
          Klip helps you save video and audio directly to your device. Requires Android 10 or newer. The two most recent preview revisions are R4 and R3. Choose R4 for the newest features.

          ### Recent revisions
          - **R4:** Shows completed downloads with an open or play button; includes R3.
          - **R3:** Adds parallel downloads for supported HLS/DASH segments.

          ### Choose your APK
          - **ARM64:** for most modern Android phones, including Xiaomi 14.
          - **ARMv7:** for compatible 32-bit devices.
          - **x86_64:** for x86-64 devices or emulators.
          - **Universal:** includes all three architectures if you are unsure.

          ### Features
          Video quality and audio options, video information lookup, HTML5 and JW Player media detection, optional browser pop-up and basic ad-domain blocking, parallel HLS/DASH fragment downloads, a result card with open or play buttons, cancellation, and automatic yt-dlp update checks. The built-in blocklist is limited and may not block all ads. Downloads run on your device without a Klip download server.

          ### Installation
          Download the matching APK and open it on your Android device. Allow installation from the selected source if Android asks. This is a **debug preview** that has not been tested on every device. If Android rejects an update because its signing key differs, uninstall the old version before installing the new one. Existing downloads in your Downloads folder are not removed by the app.

          Not every site or video is supported. Special authentication, DRM protection, or site changes can prevent downloads. Keep Klip open while downloading. Download content only where you have permission.
          NOTES
          if gh release view klip-v0.2.5 >/dev/null 2>&1; then
            gh release upload klip-v0.2.5 /tmp/klip-apks/*.apk --clobber
            gh release edit klip-v0.2.5 --notes-file /tmp/klip-notes.md
            git tag -f klip-v0.2.5 "$GITHUB_SHA"
            git push --force origin refs/tags/klip-v0.2.5
          else
            gh release create klip-v0.2.5 /tmp/klip-apks/*.apk --target "$GITHUB_SHA" --prerelease --title "Klip 0.2.5 for Android" --notes-file /tmp/klip-notes.md
          fi
